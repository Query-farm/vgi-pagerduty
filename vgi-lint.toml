# vgi-lint settings for this worker: https://github.com/Query-farm/vgi-lint-check
# `make lint-explain`, `vgi-lint lint` in this directory, and CI's metadata job all
# read this file. Look up a rule with `vgi-lint explain VGI123`; print the metadata tag
# contract with `vgi-lint spec`.

# The worker to attach, relative to this directory. Build it first with `make build`.
location = "bin/vgi-pagerduty-worker"

# Gate at "info": zero findings of any severity.
fail_on = "info"

# Waive a finding only with a kind and a reason, so the waiver can be audited:
#   domain-exemption  permanent and legitimate for this worker
#   deferred          a real defect you will fix; add expires = "YYYY-MM-DD"
#   timing            slow or flaky because of the environment, not the metadata
#   tooling-bug       the linter is wrong; report it upstream
ignore = [
  # { code = "VGI146", kind = "domain-exemption", reason = "every entry point needs a key" },
]

# Adopting the gate on a worker that already has findings? Record them once with
#   vgi-lint lint --baseline vgi-lint-baseline --update-baseline
# and uncomment the next line. Only new findings fail after that.
# baseline = "vgi-lint-baseline"

# VGI808 guesses a foreign key from a `<base>_id` column name. Every real reference in this
# catalog is declared (services / escalation_rules → escalation_policies, team_members → teams
# and users, business_services → teams). On these tables the flagged column is the table's own
# primary key, not a reference to another table.
[per_object."pagerduty.main.business_services"]
ignore = [{ code = "VGI808", kind = "tooling-bug", reason = "business_service_id is this table's own primary key, not a reference to it" }]
[per_object."pagerduty.main.maintenance_windows"]
ignore = [{ code = "VGI808", kind = "tooling-bug", reason = "maintenance_window_id is this table's own primary key, not a reference to it" }]
[per_object."pagerduty.main.schedules"]
ignore = [{ code = "VGI808", kind = "tooling-bug", reason = "schedule_id is this table's own primary key, not a reference to it" }]
[per_object."pagerduty.main.services"]
ignore = [{ code = "VGI808", kind = "tooling-bug", reason = "service_id is this table's own primary key, not a reference to it" }]
[per_object."pagerduty.main.status_pages"]
ignore = [{ code = "VGI808", kind = "tooling-bug", reason = "status_page_id is this table's own primary key, not a reference to it" }]
[per_object."pagerduty.main.tags"]
ignore = [{ code = "VGI808", kind = "tooling-bug", reason = "tag_id is this table's own primary key, not a reference to it" }]
[per_object."pagerduty.main.teams"]
ignore = [{ code = "VGI808", kind = "tooling-bug", reason = "team_id is this table's own primary key, not a reference to it" }]
[per_object."pagerduty.main.users"]
ignore = [{ code = "VGI808", kind = "tooling-bug", reason = "user_id is this table's own primary key, not a reference to it" }]
